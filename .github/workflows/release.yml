name: Release APK

# 打 v* 标签即出包并发布 GitHub Release：
#   git tag v0.9.16 && git push origin v0.9.16
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v0.9.16），留空则用短 commit'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Resolve version and rename APK
        id: apk
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              VERSION="${{ github.ref_name }}"
            else
              VERSION="dev-${GITHUB_SHA::7}"
            fi
          fi
          OUT="Aegis-Browser-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Aegis Browser ${{ steps.apk.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body_path: docs/release-notes-0.9.17.md
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: false
          make_latest: true

      - name: Upload APK artifact (non-tag runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-Browser-Release-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
